name: Godot Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  export:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4
      - name: Hazırlıq
        run: |
          mkdir -p ~/.local/share/godot/export_templates ~/.config/godot build
          cp -r /root/.local/share/godot/export_templates/4.3.stable ~/.local/share/godot/export_templates/ || true
          cp /root/.config/godot/editor_settings-4.tres ~/.config/godot/ || true
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore /root/debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12
      - name: Import
        run: godot --headless --import || true
      - name: APK export
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /root/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: godot --headless --export-debug "Android" build/mafiaaz.apk
      - uses: actions/upload-artifact@v4
        with:
          name: mafiaaz-godot-apk
          path: build/mafiaaz.apk
